.noteItem{display:flex;align-items:center;gap:8px;border-bottom:1px solid #333849}.noteItem .noteRow{flex:1;min-width:0;border-bottom:0}.noteTrash{display:grid;place-items:center;flex:none;width:46px;height:46px;border:1px solid #484052;border-radius:13px;background:#342630;color:#ffa9b7;cursor:pointer;touch-action:manipulation}.noteTrash:focus-visible{outline:3px solid #b5b9ff;outline-offset:2px}.noteTrash:active{transform:scale(.94)}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./cloud-config.js"></script></head><body><div class="app"><div class="eyebrow">SECOND BRAIN <span class="tag">PRIVATE PREVIEW</span></div><div class="header"><h1 id="title">Home</h1><button class="round" id="plus" aria-label="New item">+</button></div><div id="screen"></div></div><nav class="nav"><button data-nav="home"><b>⌂</b>Home</button><button data-nav="tasks"><b>☑</b>Tasks</button><button data-nav="notes"><b>▤</b>Notes</button><button data-nav="settings"><b>⚙</b>Settings</button></nav><div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="top"><button class="btn secondary" id="close">← Back</button><span class="eyebrow" id="sheetkind">EDIT</span></div><div id="sheetcontent"></div></div><div class="toast" id="toast" role="status" aria-live="polite">✨ Done! One less thing ✨</div><script>
(()=>{'use strict';const KEY='sb-live-ui-v1';const seed={tasks:[{id:'p1',title:'Organize Apple Notes',lane:'Now',star:true,order:1,details:'One tiny folder at a time.',due:'',repeat:''},{id:'p2',title:'Review upcoming appointments',lane:'Now',star:false,order:2,details:'',due:'',repeat:''},{id:'p3',title:'Plan a weekend outing',lane:'Later',star:false,order:3,details:'',due:'',repeat:''},{id:'p4',title:'Research a new creative project',lane:'Later',star:false,order:4,details:'',due:'',repeat:''}],notes:[{id:'n1',title:'Ideas & inspiration',body:'A quiet place to capture ideas.\\n\\nThis preview does not touch your cloud notes.',folder:'Notes',star:false,updated:Date.now()},{id:'n2',title:'Places to try',body:'Rosie Pizzeria',folder:'Places',star:false,updated:Date.now()-30000}]};let state;try{const old=JSON.parse(localStorage.getItem(KEY));state=old&&Array.isArray(old.tasks)&&Array.isArray(old.notes)?old:{tasks:[],notes:[]}}catch(e){state={tasks:[],notes:[]}}let tab='home',filter='All',search='',currentPick=null,editing=null,dragging=null,holdTimer=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),storeLocal=()=>localStorage.setItem(KEY,JSON.stringify(state)),store=()=>{storeLocal();window.SecondBrainCloud?.queue?.()};function choose(){const t=state.tasks.filter(t=>!t.done);if(!t.length)return null;const pool=t.flatMap(x=>Array(x.star?6:1).fill(x));return pool[Math.floor(Math.random()*pool.length)]}function noteOrder(){return [...state.notes].sort((a,b)=>(b.star?1:0)-(a.star?1:0)||(b.updated||0)-(a.updated||0))}function taskOrder(){return [...state.tasks].sort((a,b)=>(a.order??0)-(b.order??0))}function taskList(tasks){return tasks.map(t=>`<div class="task" data-id="${esc(t.id)}"><button class="check" data-check="${esc(t.id)}" aria-label="Complete ${esc(t.title)}"></button><div class="taskBody" data-edit="${esc(t.id)}"><div class="taskName">${esc(t.title)}</div><div class="sub">${esc(t.lane||'Later')}${t.due?' · ⏰ '+esc(new Date(t.due).toLocaleString()):''}${t.repeat?' · ↻ '+esc(t.repeat):''}</div></div><button class="iconbtn star ${t.star?'on':''}" data-star="${esc(t.id)}" aria-label="${t.star?'Unstar':'Star'} task">${t.star?'★':'☆'}</button><button class="iconbtn drag" data-drag="${esc(t.id)}" aria-label="Drag task to reorder">⠿</button></div>`).join('')||'<div class="empty">Nothing here. Add a thought above ✨</div>'}function recentTasks(){return taskOrder().slice(0,5)}function render(){const titles={home:'Your space',tasks:'All Tasks',notes:'Notes',settings:'Settings'};$('#title').textContent=titles[tab];document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===tab));const c=$('#screen');if(tab==='home'){if(!currentPick||!state.tasks.some(t=>t.id===currentPick.id))currentPick=choose();c.innerHTML=`<div class="card focus"><div class="eyebrow">✦ YOUR NEXT THING</div><div class="focus-title">${esc(currentPick?.title||'Everything is complete!')}</div><div class="row"><button class="btn" id="reroll">🎲 Pick another</button>${currentPick?`<button class="btn secondary" data-edit="${esc(currentPick.id)}">Open task</button>`:''}</div><div class="small" style="margin-top:12px">★ Starred tasks have 6× the chance of being selected.</div></div><div class="sectionhead"><h2>Recent Tasks</h2><button class="btn ghost" data-nav="tasks">See all</button></div><form class="inline" id="fasttask"><input name="title" aria-label="Add new task" placeholder="+ Add new task…" required maxlength="300"><button>Add</button></form><div class="card">${taskList(recentTasks())}</div><div class="sectionhead"><h2>Recent Notes</h2><button class="btn ghost" data-nav="notes">See all</button></div><form class="inline" id="fastnote"><input name="title" aria-label="Add new note" placeholder="+ Add new note…" required maxlength="300"><button>Add</button></form><div class="card">${noteOrder().slice(0,4).map(n=>noteRow(n)).join('')||'<div class="empty">No notes yet</div>'}</div>`}else if(tab==='tasks'){let list=taskOrder().filter(t=>(filter==='All'||t.lane===filter)&&[t.title,t.details].join(' ').toLowerCase().includes(search.toLowerCase()));c.innerHTML=`<form class="inline" id="fasttask"><input name="title" placeholder="+ Add new task…" aria-label="Add new task" maxlength="300" required><button>Add</button></form><input id="find" class="search" placeholder="⌕ Search tasks" value="${esc(search)}" aria-label="Search tasks"><div class="chips">${['All','Now','Later'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="small">${list.length} tasks · Drag ⠿ to reorder · ★ increases priority</div><div class="card" id="tasklist">${taskList(list)}</div>`}else if(tab==='notes'){c.innerHTML=`<form class="inline" id="fastnote"><input name="title" placeholder="+ Add new note…" aria-label="Add new note" maxlength="300" required><button>Add</button></form><input id="find" class="search" placeholder="⌕ Search notes" value="${esc(search)}" aria-label="Search notes"><div class="card">${noteOrder().filter(n=>[n.title,n.body].join(' ').toLowerCase().includes(search.toLowerCase())).map(n=>noteRow(n)).join('')||'<div class="empty">No notes yet</div>'}</div>`}else c.innerHTML=`<div class="card"><h2>Second Brain Cloud</h2><p class="muted">Your tasks and notes sync securely after you sign in. Cloud status is shown below.</p></div><div id="cloud-area"></div><div class="card"><h2>Notifications</h2><p>Choose a date, time, and repeat rule inside any task. You can enable alerts while this preview is open.</p><button class="btn" id="notify">${typeof Notification==='undefined'?'Notifications unsupported':'Enable notifications'}</button><div class="notice">iPhone background push alerts require a deployed HTTPS app, a service worker, push subscription, and a server scheduler. Background push notifications require a service worker and server scheduler; not enabled yet.</div></div><div class="card"><h2>What's included</h2><p class="muted">Bigger typography and spacing, a subtle grid/gradient, Now/Later, starred weighted suggestions, touch drag reordering, inline inputs, and persistent sample edits.</p></div>`}function noteRow(n){return `<div class="noteItem"><button class="noteRow" data-note="${esc(n.id)}"><strong>${n.star?'★ ':''}${esc(n.title)}</strong><div class="sub">${esc((n.body||'').slice(0,90))}</div></button><button class="noteTrash" data-trash-note="${esc(n.id)}" aria-label="Delete note: ${esc(n.title)}" title="Delete note"><svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button></div>`}function openSheet(html,label){$('#sheetkind').textContent=label;$('#sheetcontent').innerHTML=html;$('#sheet').classList.add('show')}function closeSheet(){$('#sheet').classList.remove('show');editing=null;render()}function taskEdit(t){editing=t||null;openSheet(`<h2>${t?'Edit task':'New task'}</h2><form id="editform"><label>Task name<input class="formfield" name="title" maxlength="300" required value="${esc(t?.title||'')}"></label><label>Details<textarea class="formfield" name="details">${esc(t?.details||'')}</textarea></label><div class="formgrid"><label>When<select class="formfield" name="lane"><option ${t?.lane==='Now'?'selected':''}>Now</option><option ${!t||t.lane==='Later'?'selected':''}>Later</option></select></label><label>Repeat<select class="formfield" name="repeat">${['Never','Daily','Weekly','Every 2 weeks','Monthly'].map(x=>`<option ${t?.repeat===(x==='Never'?'':x)?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Remind me at<input class="formfield" name="due" type="datetime-local" value="${esc(t?.due||'')}"></label><label class="switch"><input type="checkbox" name="star" ${t?.star?'checked':''}> Star this task (6× in picker)</label><div class="row" style="margin-top:25px"><button class="btn">Save task</button>${t?'<button type="button" class="btn secondary" id="deleteTask">Delete</button>':''}</div></form>`,'TASK');$('#editform').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);const name=String(d.get('title')||'').trim();if(!name)return;if(t){Object.assign(t,{title:name,details:String(d.get('details')||''),lane:d.get('lane'),due:String(d.get('due')||''),repeat:d.get('repeat')==='Never'?'':d.get('repeat'),star:d.has('star')})}else state.tasks.unshift({id:uid(),title:name,details:String(d.get('details')||''),lane:d.get('lane'),due:String(d.get('due')||''),repeat:d.get('repeat')==='Never'?'':d.get('repeat'),star:d.has('star'),order:Math.min(0,...state.tasks.map(t=>t.order??1))-1});store();closeSheet()};if(t)$('#deleteTask').onclick=()=>{if(confirm('Delete this task?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);store();closeSheet()}}}function noteEdit(n){editing=n||null;openSheet(`<h2>${n?'Edit note':'New note'}</h2><form id="editform"><input class="formfield" name="title" aria-label="Note title" placeholder="Title" required maxlength="300" value="${esc(n?.title||'')}"><textarea class="formfield" name="body" aria-label="Note body" placeholder="Start writing…">${esc(n?.body||'')}</textarea><label>Folder<input class="formfield" name="folder" value="${esc(n?.folder||'Notes')}"></label><label class="switch"><input type="checkbox" name="star" ${n?.star?'checked':''}> Pin note</label><div class="row"><button class="btn">Save note</button>${n?'<button type="button" class="btn secondary" id="deleteNote">Delete</button>':''}</div></form>`,'NOTE');$('#editform').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);const obj={title:d.get('title').trim(),body:String(d.get('body')||''),folder:String(d.get('folder')||'Notes'),star:d.has('star'),updated:Date.now()};if(n)Object.assign(n,obj);else state.notes.unshift({id:uid(),...obj});store();closeSheet()};if(n)$('#deleteNote').onclick=()=>{if(confirm('Delete this note?')){state.notes=state.notes.filter(x=>x.id!==n.id);store();closeSheet()}}}let ttt;function toast(){const e=$('#toast');e.classList.add('show');clearTimeout(ttt);ttt=setTimeout(()=>e.classList.remove('show'),1250)}function complete(btn){const id=btn.dataset.check;if(!id)return;const task=state.tasks.find(t=>t.id===id);if(!task)return;btn.disabled=true;btn.textContent='✓';btn.closest('.task')?.classList.add('completed');toast();setTimeout(()=>{state.tasks=state.tasks.filter(t=>t.id!==id);if(currentPick?.id===id)currentPick=null;store();render()},window.matchMedia('(prefers-reduced-motion: reduce)').matches?50:650)}function move(source,target){const ordered=taskOrder();const from=ordered.findIndex(t=>t.id===source),to=ordered.findIndex(t=>t.id===target);if(from<0||to<0||from===to)return;const [item]=ordered.splice(from,1);ordered.splice(to,0,item);ordered.forEach((t,i)=>t.order=i+1);store();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){tab=b.dataset.nav;search='';render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.check){complete(b)}else if(b.dataset.star){const t=state.tasks.find(t=>t.id===b.dataset.star);if(t){t.star=!t.star;store();render()}}else if(b.dataset.edit){taskEdit(state.tasks.find(t=>t.id===b.dataset.edit))}else if(b.dataset.trashNote){const n=state.notes.find(t=>String(t.id)===b.dataset.trashNote);if(n&&confirm('Delete note “'+n.title+'”? This cannot be undone.')){state.notes=state.notes.filter(t=>String(t.id)!==String(n.id));store();render()}}else if(b.dataset.note){noteEdit(state.notes.find(t=>t.id===b.dataset.note))}else if(b.id==='reroll'){currentPick=choose();render()}else if(b.id==='plus'){tab==='notes'?noteEdit(null):taskEdit(null)}else if(b.id==='close'){closeSheet()}else if(b.id==='reset'){alert('Use the task and notes screens to manage your data.')}else if(b.id==='notify'){if(typeof Notification!=='undefined'&&window.isSecureContext)Notification.requestPermission().then(p=>alert('Browser notification permission: '+p));else alert('Downloaded HTML cannot register iPhone push notifications. Reminders are saved, but background alerts need the hosted app.')}});
document.addEventListener('submit',e=>{if(e.target.id==='fasttask'){e.preventDefault();const title=String(new FormData(e.target).get('title')||'').trim();if(title){state.tasks.unshift({id:uid(),title,lane:'Later',star:false,order:Math.min(0,...state.tasks.map(t=>t.order??1))-1,details:'',due:'',repeat:''});store();render()}}else if(e.target.id==='fastnote'){e.preventDefault();const title=String(new FormData(e.target).get('title')||'').trim();if(title){const n={id:uid(),title,body:'',folder:'Notes',star:false,updated:Date.now()};state.notes.unshift(n);store();noteEdit(n)}}});document.addEventListener('input',e=>{if(e.target.id==='find'){search=e.target.value;const caret=e.target.selectionStart;render();$('#find')?.focus();$('#find')?.setSelectionRange(caret,caret)}});
// Pointer-event touch drag + desktop drag. Reorder only when released over another task.
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag]');if(!handle)return;dragging={id:handle.dataset.drag,startY:e.clientY,pointer:e.pointerId,active:false,handle};holdTimer=setTimeout(()=>{if(dragging){dragging.active=true;handle.setPointerCapture?.(e.pointerId);handle.style.color='#f0d58d'}},130)});document.addEventListener('pointermove',e=>{if(!dragging)return;if(!dragging.active&&Math.abs(e.clientY-dragging.startY)>12){clearTimeout(holdTimer);dragging=null;return}if(dragging.active){e.preventDefault();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.task');document.querySelectorAll('.task').forEach(t=>t.style.outline=t===target?'2px dashed #a9b3ff':'')}});function stopDrag(e){clearTimeout(holdTimer);if(!dragging)return;const d=dragging;dragging=null;document.querySelectorAll('.task').forEach(t=>t.style.outline='');if(d.active){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.task');if(target&&target.dataset.id!==d.id)move(d.id,target.dataset.id);d.handle.style.color=''}}document.addEventListener('pointerup',stopDrag);document.addEventListener('pointercancel',stopDrag);
// Due reminders check only while preview is open. No background push service.
window.SecondBrainApp={getState:()=>state,setState:(d)=>{state=d;storeLocal();render()},render,localSave:storeLocal};let alerted=new Set();function checkReminders(){if(typeof Notification==='undefined'||Notification.permission!=='granted'||!window.isSecureContext)return;const now=Date.now();for(const t of state.tasks){if(!t.due)continue;const when=new Date(t.due).getTime();if(!Number.isFinite(when)||when>now||now-when>60000||alerted.has(t.id))continue;alerted.add(t.id);try{new Notification('Second Brain reminder',{body:t.title})}catch(e){}}}setInterval(checkReminders,30000);render();})();
